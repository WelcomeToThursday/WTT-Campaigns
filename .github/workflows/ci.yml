name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts-and-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Shared contracts
        run: dotnet run --project Tests -c Release
      - name: Server compilation
        run: dotnet build Server -c Release --nologo
